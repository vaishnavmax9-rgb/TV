<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Wavepacket Simulator V3</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>1D Quantum Tunneling & Wavepacket Simulator</h1>
            <p>Rigorous Finite Difference Time Domain (FDTD) Simulation</p>
        </header>
        
        <main>
            <!-- 16:9 Aspect Ratio Canvas -->
            <canvas id="simCanvas" width="960" height="540"></canvas>
            
            <div class="dashboard">
                <!-- Learning Scenarios -->
                <div class="panel">
                    <h3>Learning Scenarios</h3>
                    <div class="btn-grid">
                        <button id="btnEasy" class="scenario-btn">Easy Tunneling</button>
                        <button id="btnBalanced" class="scenario-btn active">Balanced</button>
                        <button id="btnHard" class="scenario-btn">Hard Tunneling</button>
                    </div>
                </div>

                <!-- Wavepacket Parameters -->
                <div class="panel">
                    <h3>Wavepacket Parameters</h3>
                    <div class="control-group">
                        <label for="particleEnergy">Particle Energy (k0): <span id="valEnergy">2.0</span></label>
                        <input type="range" id="particleEnergy" min="0.5" max="5.0" step="0.1" value="2.0">
                    </div>
                </div>

                <!-- Potential Barrier -->
                <div class="panel">
                    <h3>Potential Barrier</h3>
                    <div class="control-group">
                        <label for="barrierWidth">Barrier Width: <span id="valWidth">20</span></label>
                        <input type="range" id="barrierWidth" min="5" max="100" value="20">
                    </div>
                    <div class="control-group">
                        <label for="barrierHeight">Barrier Height: <span id="valHeight">1.0</span></label>
                        <input type="range" id="barrierHeight" min="0" max="2" step="0.1" value="1.0">
                    </div>
                </div>

                <!-- Engine Controls -->
                <div class="panel actions">
                    <h3>Engine Controls</h3>
                    <div class="control-group">
                        <label for="simSpeed">Simulation Speed: <span id="valSpeed">10</span>x</label>
                        <input type="range" id="simSpeed" min="1" max="50" step="1" value="10">
                    </div>
                    <div class="btn-grid-horizontal">
                        <button id="btnReset" class="action-btn">Reset Wave</button>
                        <button id="btnPlayPause" class="action-btn">Pause</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/simulator.js"></script>
</body>
</html>
